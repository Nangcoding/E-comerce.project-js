<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="/style/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/style/checkout.css"> <!-- New CSS -->
</head>

<body>
    <!-- Header -->
    <section id="header">
        <a href="../index.html"><img class="logo" src="/assets/image/logo.png" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a href="../index.html">Home</a></li>
                <li><a href="/template/shop.html">Shop</a></li>
                <li><a class="active" href="/template/checkout.html">Checkout</a></li>
                <li><a href="/template/about.html">About</a></li>
                <li><a href="/template/contact.html">Contact</a></li>
                <li id="lg-bag">
                    <a href="/template/cart.html">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span id="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </section>

    <!-- Checkout Form -->
    <section id="checkout" class="section-p1">
        <h2>Checkout</h2>
        <div class="checkout-container">
            <!-- Billing Details -->
            <div class="billing-details">
                <h3>Billing Details</h3>
                <form id="checkout-form">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com" required>

                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="123 Main St" required>

                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="New York" required>

                    <label for="zip">Zip Code</label>
                    <input type="text" id="zip" placeholder="10001" required>

                    <label for="payment">Payment Method</label>
                    <select id="payment" required>
                        <option value="credit">Credit Card</option>
                        <option value="paypal">PayPal</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>

                    <button type="submit" class="normal">Place Order</button>
                </form>
            </div>

            <!-- Order Summary -->
            <div class="order-summary">
                <h3>Order Summary</h3>
                <table>
                    <tr>
                        <td>Total</td>
                        <td><strong id="checkout-total">$0</strong></td>
                    </tr>
                </table>
            </div>
        </div>
    </section>

    <script>
        // Load cart total from previous page
        const cartTotal = localStorage.getItem('cartTotal') || 0;
        document.getElementById('checkout-total').textContent = `$${cartTotal}`;

        // Handle form submission
        const checkoutForm = document.getElementById('checkout-form');
        checkoutForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you! Your order has been placed.');
            localStorage.removeItem('cartTotal');
            window.location.href = '../index.html';
        });
    </script>
</body>

</html>
