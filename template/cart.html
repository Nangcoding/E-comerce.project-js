<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <link rel="stylesheet" href="/style/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <section id="header">
        <a href="#"><img class="logo" src="/assets/image/logo.png" alt=""></a>
        <div>
            <ul id="navbar">
                <li><a class="active" href="../index.html">Home</a></li>
                <li><a href="/template/shop.html">Shop</a></li>
                <li><a href="/template/checkout.html">Checkout</a></li>
                <li><a href="/template/about.html">About</a></li>
                <li><a href="/template/contact.html">Contact</a></li>
                <li id="lg-bag">
                    <a href="/template/cart.html">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span id="cart-count">0</span>
                    </a>
                </li>

            </ul>
        </div>
    </section>

    <section id="cart" class="section-p1">
        <h2>Your Shopping Cart</h2>

        <table width="100%">
            <thead>
                <tr>
                    <th>Remove</th>
                    <th>Image</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                <!-- JS inserts items here -->
            </tbody>
        </table>
    </section>

    <section id="cart-add" class="section-p1">
        <div id="subtotal">
            <h3>Cart Totals</h3>
            <table>
                <tr>
                    <td>Total</td>
                    <td><strong id="cart-total">$0</strong></td>
                </tr>
            </table>
           <button class="normal" id="checkout-btn">Proceed to Checkout</button>
        </div>
    </section>

    <script src="/script/cart.js"></script>
</body>

</html>
